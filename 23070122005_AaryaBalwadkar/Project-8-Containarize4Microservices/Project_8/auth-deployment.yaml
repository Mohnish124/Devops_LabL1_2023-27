apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
      - name: auth-api
        image: auth-api:1.0
        # CRITICAL: This tells Kubernetes NOT to look on the internet for the image!
        imagePullPolicy: Never 
        ports:
        - containerPort: 5001
        env:
        # Dynamically injecting your Secret into the application
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: annotation-secrets
              key: jwt-secret
        # Dynamically injecting your ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: annotation-configmap
              key: NODE_ENV
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api-service
spec:
  type: NodePort
  selector:
    app: auth-api
  ports:
  - port: 5001
    targetPort: 5001