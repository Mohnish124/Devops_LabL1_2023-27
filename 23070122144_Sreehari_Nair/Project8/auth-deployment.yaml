apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      containers:
        - name: auth-service
          image: auth-service:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-configmap
                  key: port
            - name: TOKEN_EXPIRY
              valueFrom:
                configMapKeyRef:
                  name: auth-configmap
                  key: token_expiry
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: auth-configmap
                  key: db_host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-configmap
                  key: db_port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: auth-configmap
                  key: db_name
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: auth-configmap
                  key: db_user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: jwt-secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: admin-password
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
