apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: retail-app

  template:
    metadata:
      labels:
        app: retail-app

    spec:
      containers:
      - name: retail-container
        image: retail_store_app:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8081

        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"