apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-feed
  labels:
    app: social-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-feed
  template:
    metadata:
      labels:
        app: social-feed
    spec:
      containers:
        - name: social-feed
          image: social-feed:2.2
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
