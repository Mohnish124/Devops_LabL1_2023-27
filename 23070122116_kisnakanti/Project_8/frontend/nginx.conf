server { listen 80; root /usr/share/nginx/html; index index.html; location / { try_files $uri /index.html; } location /api/products { proxy_pass http://product-service:3002/products; } location /api/login { proxy_pass http://user-service:3001/login; } location /api/register { proxy_pass http://user-service:3001/register; } location /api/orders { proxy_pass http://order-service:3003/orders; } location /api/payments { proxy_pass http://payment-service:3004/payments; } location /health { return 200 '{"status":"ok"}'; add_header Content-Type application/json; } }

