apiVersion: apps/v1
kind: Deployment
metadata: {name: user-deployment, namespace: ecommerce}
spec: {replicas: 1, selector: {matchLabels: {app: user}}, template: {metadata: {labels: {app: user}}, spec: {containers: [{name: user, image: ecommerce-user-service:latest, imagePullPolicy: IfNotPresent, ports: [{containerPort: 3001}], envFrom: [{configMapRef: {name: app-config}}, {secretRef: {name: postgres-secret}}]}]}}}
---
apiVersion: v1
kind: Service
metadata: {name: user-service, namespace: ecommerce}
spec: {selector: {app: user}, ports: [{port: 3001, targetPort: 3001}]}
---
