apiVersion: v1
kind: ConfigMap
metadata: {name: db-init, namespace: ecommerce}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, name VARCHAR(120) NOT NULL, email VARCHAR(255) UNIQUE NOT NULL, password VARCHAR(255) NOT NULL, created_at TIMESTAMPTZ DEFAULT NOW());
    CREATE TABLE IF NOT EXISTS products (id SERIAL PRIMARY KEY, name VARCHAR(160) NOT NULL, description TEXT NOT NULL DEFAULT '', price NUMERIC(10,2) NOT NULL, stock INTEGER NOT NULL DEFAULT 0, image_url TEXT NOT NULL DEFAULT '', created_at TIMESTAMPTZ DEFAULT NOW());
    CREATE TABLE IF NOT EXISTS orders (id SERIAL PRIMARY KEY, user_id INTEGER REFERENCES users(id), total_amount NUMERIC(10,2) NOT NULL, status VARCHAR(40) NOT NULL DEFAULT 'pending', created_at TIMESTAMPTZ DEFAULT NOW());
    CREATE TABLE IF NOT EXISTS order_items (id SERIAL PRIMARY KEY, order_id INTEGER REFERENCES orders(id) ON DELETE CASCADE, product_id INTEGER REFERENCES products(id), quantity INTEGER NOT NULL, price NUMERIC(10,2) NOT NULL);
    CREATE TABLE IF NOT EXISTS payments (id SERIAL PRIMARY KEY, order_id INTEGER REFERENCES orders(id) ON DELETE CASCADE, amount NUMERIC(10,2) NOT NULL, status VARCHAR(40) NOT NULL, transaction_id VARCHAR(80), created_at TIMESTAMPTZ DEFAULT NOW());
