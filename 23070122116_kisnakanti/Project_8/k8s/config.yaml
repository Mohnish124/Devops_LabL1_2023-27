apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: ecommerce}
data:
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: ecommerce
  USER_SERVICE_URL: http://user-service:3001
  PRODUCT_SERVICE_URL: http://product-service:3002
  ORDER_SERVICE_URL: http://order-service:3003
  PAYMENT_SERVICE_URL: http://payment-service:3004
---
apiVersion: v1
kind: Secret
metadata: {name: postgres-secret, namespace: ecommerce}
type: Opaque
stringData:
  POSTGRES_USER: ecommerce
  POSTGRES_PASSWORD: ecommerce_demo_password
  POSTGRES_DB: ecommerce

