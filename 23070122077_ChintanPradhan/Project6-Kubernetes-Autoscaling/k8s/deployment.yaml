apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-feed-deployment
  labels:
    app: social-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-feed
  template:
    metadata:
      labels:
        app: social-feed
    spec:
      containers:
        - name: social-feed
          image: social-feed-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
