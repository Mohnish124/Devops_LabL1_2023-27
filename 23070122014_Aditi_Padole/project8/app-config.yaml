# app-config.yaml  (place in project8/ root)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: project8
data:
  BACKEND_URL: "backend-service:5000"
  AUTH_URL: "auth-service:4000"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: project8
type: Opaque
data:
  JWT_SECRET: c3VwZXJzZWNyZXQ=   # base64 for "supersecret"