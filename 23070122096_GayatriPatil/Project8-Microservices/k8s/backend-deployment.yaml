apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: project8-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_PORT
              valueFrom:
                configMapKeyRef:
                  name: project8-config
                  key: BACKEND_PORT
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: project8-config
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: project8-config
                  key: MONGO_PORT