apiVersion: apps/v1
kind: Deployment

metadata:
  name: social-media-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: social-media

  template:
    metadata:
      labels:
        app: social-media

    spec:
      containers:
        - name: social-media-container

          image: social-media-app:1.0

          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"

            limits:
              cpu: "500m"