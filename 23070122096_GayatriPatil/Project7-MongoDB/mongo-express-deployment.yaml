apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongo-express

  template:
    metadata:
      labels:
        app: mongo-express

    spec:
      containers:
        - name: mongo-express
          image: mongo-express:latest

          ports:
            - containerPort: 8081

          env:
            # MongoDB Kubernetes Service
            - name: ME_CONFIG_MONGODB_SERVER
              value: mongo-service

            # MongoDB port
            - name: ME_CONFIG_MONGODB_PORT
              value: "27017"

            # MongoDB username from Secret
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-user

            # MongoDB password from Secret
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-password

            # Mongo Express login
            - name: ME_CONFIG_BASICAUTH_USERNAME
              value: admin

            - name: ME_CONFIG_BASICAUTH_PASSWORD
              value: admin123