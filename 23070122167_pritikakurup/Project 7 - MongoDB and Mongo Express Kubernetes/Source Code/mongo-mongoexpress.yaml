# -----------------------------------
# MongoDB Secret
# -----------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
type: Opaque
data:
  mongo-root-username: YWRtaW4=
  mongo-root-password: cGFzc3dvcmQ=

---

# -----------------------------------
# MongoDB Deployment
# -----------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo

    spec:
      containers:
        - name: mongo
          image: mongo:7

          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-root-username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-root-password

---

# -----------------------------------
# MongoDB Service
# -----------------------------------

apiVersion: v1
kind: Service
metadata:
  name: mongo-service

spec:
  selector:
    app: mongo

  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---

# -----------------------------------
# Mongo Express ConfigMap
# -----------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-configmap

data:
  mongo-url: mongo-service

---

# -----------------------------------
# Mongo Express Deployment
# -----------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongo-express

  template:
    metadata:
      labels:
        app: mongo-express

    spec:
      containers:
        - name: mongo-express
          image: mongo-express:latest

          ports:
            - containerPort: 8081

          env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-root-username

            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-root-password

            - name: ME_CONFIG_MONGODB_SERVER
              valueFrom:
                configMapKeyRef:
                  name: mongo-configmap
                  key: mongo-url

---

# -----------------------------------
# Mongo Express Service
# -----------------------------------

apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service

spec:
  type: NodePort

  selector:
    app: mongo-express

  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30081