    spec:
      containers:
        - name: orders-service
          image: nginx:latest
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV

---
apiVersion: v1
kind: Service
