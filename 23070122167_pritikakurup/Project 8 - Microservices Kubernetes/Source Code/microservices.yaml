      labels:
        app: products-service
    spec:
      containers:
        - name: products-service
          image: nginx:latest
          ports:
            - containerPort: 80
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_VERSION

---
apiVersion: v1
kind: Service
metadata:
  name: products-service
spec:
  selector:
    app: products-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
# ==========================================
# ORDERS MICROSERVICE
# ==========================================
