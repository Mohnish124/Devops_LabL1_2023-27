apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-media-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-media
  template:
    metadata:
      labels:
        app: social-media
    spec:
      containers:
        - name: social-media
          image: nginx:latest
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 500m
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: social-media-service
spec:
  type: NodePort
  selector:
    app: social-media
  ports:
    - port: 80
      targetPort: 80