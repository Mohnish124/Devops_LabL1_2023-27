version: "3"

services:

  flask-app:
    build: .
    container_name: flask-container
    ports:
      - "5000:5000"
    depends_on:
      - db


  db:
    image: postgres:16
    container_name: postgres-container

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hello_db

    ports:
      - "5432:5432"