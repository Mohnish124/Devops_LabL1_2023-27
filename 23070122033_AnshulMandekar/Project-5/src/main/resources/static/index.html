<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Store</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            color:#333;
        }

        .container{
            width:90%;
            max-width:900px;
            background:#fff;
            border-radius:16px;
            box-shadow:0 12px 35px rgba(0,0,0,.12);
            overflow:hidden;
        }

        .header{
            background:linear-gradient(135deg,#2563eb,#0f172a);
            color:white;
            padding:35px;
            text-align:center;
        }

        .header h1{
            font-size:40px;
            margin-bottom:10px;
        }

        .header p{
            opacity:.9;
            font-size:18px;
        }

        .content{
            padding:35px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            text-decoration:none;
            color:#333;
            background:#f8fafc;
            border:1px solid #dbeafe;
            border-radius:12px;
            padding:25px;
            text-align:center;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-6px);
            box-shadow:0 10px 20px rgba(37,99,235,.15);
            border-color:#2563eb;
        }

        .card h2{
            color:#2563eb;
            margin-bottom:10px;
        }

        .status{
            text-align:center;
            padding:18px;
            background:#eff6ff;
            border-top:1px solid #dbeafe;
            color:#2563eb;
            font-weight:600;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Retail Store</h1>
        <p>Spring Boot • Docker • REST API</p>
    </div>

    <div class="content">

        <div class="cards">

            <a class="card" href="/products">
                <h2>Products</h2>
                <p>View Product Service</p>
            </a>

            <a class="card" href="/customers">
                <h2>Customers</h2>
                <p>View Customer Service</p>
            </a>

            <a class="card" href="/actuator">
                <h2>Health</h2>
                <p>Application Status</p>
            </a>

            <a class="card" href="/">
                <h2>Home</h2>
                <p>Main Dashboard</p>
            </a>

        </div>

    </div>

    <div class="status">
        ✅ Retail Store Application Running Successfully
    </div>

</div>

</body>
</html>
