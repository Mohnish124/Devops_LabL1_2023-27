version: "3.9"

services:
  flask:
    build: .
    container_name: flask-container
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hello_db
    ports:
      - "5432:5432"