apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialsphere-frontend
  labels:
    app: socialsphere-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: socialsphere-frontend
  template:
    metadata:
      labels:
        app: socialsphere-frontend
    spec:
      containers:
      - name: frontend
        image: socialsphere-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
