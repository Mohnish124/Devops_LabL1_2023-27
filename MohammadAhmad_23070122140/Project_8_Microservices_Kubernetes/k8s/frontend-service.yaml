apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: microservices-demo
  labels:
    app: frontend
    app.kubernetes.io/part-of: shopsphere
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30088
      name: http
