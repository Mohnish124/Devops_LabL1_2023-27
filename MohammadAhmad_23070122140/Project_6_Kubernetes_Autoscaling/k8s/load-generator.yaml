apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: social-media
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load-generator
        image: busybox:1.36
        command:
        - "/bin/sh"
        - "-c"
        - |
          echo "Starting synthetic social media traffic generation..."
          while true; do
            wget -q -O- http://social-media-service.social-media.svc.cluster.local/api/load?iterations=400000 > /dev/null
            wget -q -O- http://social-media-service.social-media.svc.cluster.local/api/posts?load=true > /dev/null
          done
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
