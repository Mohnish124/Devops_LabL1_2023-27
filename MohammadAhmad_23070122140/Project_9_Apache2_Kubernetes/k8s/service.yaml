apiVersion: v1
kind: Service
metadata:
  name: apache2-service
  namespace: apache-demo
  labels:
    app: apache2-server
    app.kubernetes.io/name: apache2-service
    app.kubernetes.io/part-of: apache-demo
spec:
  type: NodePort
  selector:
    app: apache2-server
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30089
      name: http
