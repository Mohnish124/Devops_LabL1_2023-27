apiVersion: v1
kind: ConfigMap
metadata:
  name: apache2-html-config
  namespace: apache-demo
  labels:
    app: apache2-server
    app.kubernetes.io/part-of: apache-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Apache2 Kubernetes Server - Project 9</title>
      <style>
        :root {
          --bg-color: #0d1117;
          --card-bg: #161b22;
          --border-color: #30363d;
          --accent-color: #e05d44;
          --text-main: #c9d1d9;
          --text-bright: #f0f6fc;
          --text-muted: #8b949e;
          --badge-bg: rgba(224, 93, 68, 0.15);
          --badge-k8s: rgba(56, 139, 253, 0.15);
          --badge-k8s-text: #58a6ff;
        }
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: var(--bg-color);
          color: var(--text-main);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 20px;
        }
        .card {
          background-color: var(--card-bg);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          max-width: 680px;
          width: 100%;
          padding: 32px;
          box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }
        .header {
          display: flex;
          align-items: center;
          gap: 16px;
          margin-bottom: 24px;
          padding-bottom: 20px;
          border-bottom: 1px solid var(--border-color);
        }
        .feather-icon {
          font-size: 40px;
        }
        .title-group h1 {
          font-size: 24px;
          color: var(--text-bright);
          font-weight: 700;
        }
        .title-group p {
          font-size: 14px;
          color: var(--text-muted);
          margin-top: 4px;
        }
        .badge-bar {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          margin-bottom: 24px;
        }
        .badge {
          font-size: 12px;
          font-weight: 600;
          padding: 4px 10px;
          border-radius: 999px;
          font-family: monospace;
        }
        .badge-apache {
          background: var(--badge-bg);
          color: var(--accent-color);
          border: 1px solid rgba(224, 93, 68, 0.4);
        }
        .badge-k8s {
          background: var(--badge-k8s);
          color: var(--badge-k8s-text);
          border: 1px solid rgba(56, 139, 253, 0.4);
        }
        .badge-status {
          background: rgba(63, 185, 80, 0.15);
          color: #3fb950;
          border: 1px solid rgba(63, 185, 80, 0.4);
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 14px;
          margin-bottom: 24px;
        }
        .grid-item {
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 14px;
        }
        .grid-label {
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          color: var(--text-muted);
          margin-bottom: 6px;
        }
        .grid-value {
          font-size: 14px;
          font-weight: 600;
          color: var(--text-bright);
          font-family: monospace;
        }
        .footer {
          font-size: 12px;
          color: var(--text-muted);
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-top: 16px;
          border-top: 1px solid var(--border-color);
        }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="header">
          <div class="feather-icon">🪶</div>
          <div class="title-group">
            <h1>Apache2 Kubernetes Server</h1>
            <p>Project 9 - DevOps Lab Submission</p>
          </div>
        </div>

        <div class="badge-bar">
          <span class="badge badge-apache">httpd:2.4-alpine</span>
          <span class="badge badge-k8s">Namespace: apache-demo</span>
          <span class="badge badge-status">HTTP 200 OK • Online</span>
        </div>

        <div class="grid">
          <div class="grid-item">
            <div class="grid-label">Student Name</div>
            <div class="grid-value">Mohammad Ahmad</div>
          </div>
          <div class="grid-item">
            <div class="grid-label">Permanent Registration Number (PNR)</div>
            <div class="grid-value">23070122140</div>
          </div>
          <div class="grid-item">
            <div class="grid-label">Kubernetes Deployment</div>
            <div class="grid-value">apache2-server (1/1 Ready)</div>
          </div>
          <div class="grid-item">
            <div class="grid-label">Kubernetes Service</div>
            <div class="grid-value">apache2-service (NodePort: 30089)</div>
          </div>
          <div class="grid-item">
            <div class="grid-label">Configuration Strategy</div>
            <div class="grid-value">ConfigMap Mounted at Document Root</div>
          </div>
          <div class="grid-item">
            <div class="grid-label">Target Container Path</div>
            <div class="grid-value">/usr/local/apache2/htdocs/index.html</div>
          </div>
        </div>

        <div class="footer">
          <span>DevOps Lab • Batch 2023-27</span>
          <span>Host Machine Access Verified</span>
        </div>
      </div>
    </body>
    </html>
