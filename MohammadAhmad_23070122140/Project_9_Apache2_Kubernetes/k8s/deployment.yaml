apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache2-server
  namespace: apache-demo
  labels:
    app: apache2-server
    app.kubernetes.io/name: apache2-server
    app.kubernetes.io/part-of: apache-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache2-server
  template:
    metadata:
      labels:
        app: apache2-server
        app.kubernetes.io/name: apache2-server
        app.kubernetes.io/part-of: apache-demo
    spec:
      containers:
        - name: apache2
          image: httpd:2.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html-volume
              mountPath: /usr/local/apache2/htdocs/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html-volume
          configMap:
            name: apache2-html-config
