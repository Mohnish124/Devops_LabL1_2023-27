services:
  retail-web-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: retail-web-app:1.0.0
    container_name: retail-web-app
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
